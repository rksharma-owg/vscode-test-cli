name: Contribution preflight
on:
  workflow_dispatch:
permissions: {}
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        sha: [53e91e5e6d7a122d72a6708298adea0442e2d5b2]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Verify tested SHA
        shell: bash
        env:
          TESTED_SHA: ${{ matrix.sha }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
      - run: git ls-files --eol src/cli/coverage.mts src/cli/coverage.test.mts src/config.cts
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node node_modules/prettier/bin/prettier.cjs --check src/cli/coverage.mts src/cli/coverage.test.mts src/config.cts
      - run: npm pack --dry-run
